        <h1>Froyo Fun Facts!</h1>
        <p>Did you know that froyo is made from fermenting milk with live bacteria, similar to yogurt you eat for breakfast?</p>
        <p>The most popular froyo flavors are vanilla, chocolate, and mango.</p>
        <p>Froyo was invented in the 1970s and was initially marketed as a healthy food</p>
